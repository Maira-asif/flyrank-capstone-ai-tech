<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
</head>
<body>
  <h1>Settings</h1>
  <form id="settingsForm" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" aria-describedby="username-error" aria-invalid="false">
      <span id="username-error" class="error" role="alert" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" aria-describedby="email-error" aria-invalid="false">
      <span id="email-error" class="error" role="alert" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" aria-describedby="password-error" aria-invalid="false">
      <span id="password-error" class="error" role="alert" aria-live="polite"></span>
    </div>

    <button type="submit" id="submitBtn" disabled>Save</button>
  </form>
  <script src="validation.js"></script>
  <script src="settings-form.js"></script>
</body>
</html>
